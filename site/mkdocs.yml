site_name: Orange Notes
site_description: 日记与开发文档
site_url: https://czl.asia
repo_url: https://example.com/your-repo
repo_name: orange-notes

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: amber

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - fenced_code

plugins:
  - search

nav:
  - 首页: index.md
  - 日记:
      - 概览: diary/index.md
      - 2026-04-18: diary/2026-04-18.md
  - 开发文档:
      - 概览: dev/index.md
      - 文档模板: dev/template.md
  - 部署指南: deploy.md
